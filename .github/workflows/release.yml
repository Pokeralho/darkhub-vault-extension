name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - name: Tag must match the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match manifest $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package
        run: |
          (cd extension && zip -qr "../darkhub-vault-$VERSION.zip" .)
          sha256sum "darkhub-vault-$VERSION.zip" > "darkhub-vault-$VERSION.zip.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "DarkHub Vault $VERSION" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" "darkhub-vault-$VERSION.zip" "darkhub-vault-$VERSION.zip.sha256" --clobber
